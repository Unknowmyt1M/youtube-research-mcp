[project]
name = "youtube-research-mcp"
version = "0.1.0"
description = "Nexora MCP — AI-powered intelligence platform for deep video, transcript, and multimodal research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Darko & Antigravity" }
]
dependencies = [
    "fastmcp>=2.14.0",
    "mcp>=1.3.0",
    "starlette>=0.40.0",
    "httpx[http2]>=0.28.0",
    "yt-dlp>=2025.2.19",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "aiosqlite>=0.21.0",
    "numpy>=1.26.0",
    "fastembed>=0.5.0",
    "bm25s>=0.2.5",
    "youtube-transcript-api>=1.2.4",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
redis = [
    "redis>=5.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-benchmark>=5.1.0",
]

[project.scripts]
nexora = "youtube_research_mcp.server:main"
youtube-research-mcp = "youtube_research_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_research_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "redis: marks tests that require a live Redis instance",
]
